<div class="min-h-screen bg-slate-50 text-slate-900 font-sans pb-20">

  <nav class="sticky top-0 z-50 bg-white/80 backdrop-blur-xl border-b border-slate-200/60 px-6 py-4">
    <div class="max-w-7xl mx-auto flex justify-between items-center">
      <div class="flex items-center gap-2">
        <div class="w-6 h-6 flex items-center justify-center">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-full h-full text-slate-900">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 3h12M6 21h12" />
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 3c0 4.5 5 6 6 9m6-9c0 4.5-5 6-6 9m0 0c1 3 6 4.5 6 9M12 12c-1 3-6 4.5-6 9" />
          </svg>
        </div>
        <h1 class="text-2xl font-bold tracking-tight text-slate-900 leading-none"><a [routerLink]="['/feed']">DailySnap.</a></h1>
      </div>
      <div class="flex gap-4">
        <button class="p-2 bg-slate-100/50 hover:bg-slate-100 rounded-full text-slate-600 transition-colors">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-6 h-6">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
          </svg>
        </button>
        <div class="w-10 h-10 bg-slate-200 rounded-full border border-slate-300 shadow-sm overflow-hidden">
            <a [routerLink]="['/profile']"><img src="https://api.dicebear.com/7.x/avataaars/svg?seed=Felix" alt="Avatar"></a>
        </div>
      </div>
    </div>
  </nav>

  <main class="max-w-7xl mx-auto mt-8 px-4">
    
    <section class="flex flex-col items-center mb-16">
      <div class="w-full max-w-md">
        <p class="text-[11px] font-black text-slate-400 uppercase tracking-[0.2em] mb-4 text-center">Tu post de hoy</p>
        
        <a [routerLink]="['/single-post']">
        <article class="flex flex-col gap-4 p-4 bg-white rounded-[2rem] shadow-xl shadow-slate-200/50 border border-emerald-100 ring-4 ring-emerald-50/50 hover:shadow-2xl transition-all duration-500">
          <div class="flex items-center gap-3 px-1">
            <div class="flex items-center gap-3 px-1">
                <div class="w-10 h-10 bg-slate-800 rounded-full shadow-sm"></div>
                <div>
                  <p class="text-sm font-bold text-slate-900">@mari_7</p>
                  <p class="text-[11px] text-slate-400 font-medium uppercase tracking-wider">Hace 4 min</p>
                </div>
            </div>
          </div>

          <div class="relative aspect-[3/4] w-full bg-slate-100 rounded-[2rem] overflow-hidden shadow-inner border border-slate-200/50 group">
            <img src="cruzymari.jpg" 
              class="w-full h-full object-cover transform group-hover:scale-105 transition-transform duration-700" 
              alt="Post de Gemini">
          </div>

          <div class="flex justify-between items-center px-4 py-3 bg-emerald-50/30 rounded-2xl border border-emerald-100/50">
            <button class="text-slate-300 hover:text-rose-500 hover:scale-110 transition-all"><svg class="w-8 h-8" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22C17.52 22 22 17.52 22 12S17.52 2 12 2 2 6.48 2 12s4.48 10 10 10z"/><path d="M8 13l2 0"/><path d="M14 13l2 0"/><path d="M12 17c0 0-1-1-2-1s-2 1-2 1"/><path d="M16 17c0 0-1-1-2-1s-2 1-2 1"/></svg></button>
            <button class="text-slate-300 hover:text-orange-400 hover:scale-110 transition-all"><svg class="w-8 h-8" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22C17.52 22 22 17.52 22 12S17.52 2 12 2 2 6.48 2 12s4.48 10 10 10z"/><path d="M8 12c0 0 1-1 2-1s2 1 2 1"/><path d="M16 12c0 0-1-1-2-1s-2 1-2 1"/><path d="M15 16c0 0-1 1-3 1s-3-1-3-1"/></svg></button>
            
            <button class="group relative p-1 transform scale-125 transition-all">
              <div class="absolute inset-0 bg-white rounded-full shadow-lg ring-2 ring-emerald-200"></div>
              <svg class="w-8 h-8 text-emerald-500 relative z-10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22C17.52 22 22 17.52 22 12S17.52 2 12 2 2 6.48 2 12s4.48 10 10 10z"/><path d="M8 10c0 0 .5 1 2 1s2-1 2-1"/><path d="M12 10c0 0 .5 1 2 1s2-1 2-1"/><path d="M9 15s1 1.5 3 1.5 3-1.5 3-1.5"/></svg>
            </button>

            <button class="text-slate-300 hover:text-yellow-400 hover:scale-110 transition-all"><svg class="w-8 h-8" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22C17.52 22 22 17.52 22 12S17.52 2 12 2 2 6.48 2 12s4.48 10 10 10z"/><path d="M8 11l2 0"/><path d="M14 11l2 0"/><path d="M9 16l6 0"/></svg></button>
            <button class="text-slate-300 hover:text-teal-400 hover:scale-110 transition-all"><svg class="w-8 h-8" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22C17.52 22 22 17.52 22 12S17.52 2 12 2 2 6.48 2 12s4.48 10 10 10z"/><path d="M8 12l2-2"/><path d="M8 10l2 2"/><path d="M14 12l2-2"/><path d="M14 10l2 2"/><path d="M8 15s1.5 3 4 3 4-3 4-3"/></svg></button>
          </div>

          <div class="px-2 pb-2 text-left">
            <p class="text-sm text-slate-600">
            <div class="px-2 pb-2"><p class="text-sm  text-slate-600"><span class="font-bold text-slate-900">@mari_7</span> Con @cruz</p></div>
          </div>
        </article>
        </a>
      </div>
      
      <div class="w-full max-w-4xl mt-12 border-b border-slate-200/60 relative">
          <span class="absolute left-1/2 -translate-x-1/2 -bottom-3 bg-slate-50 px-4 text-[10px] font-bold text-slate-400 uppercase tracking-widest">Feed de amigos</span>
      </div>
    </section>

    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
        <article class="flex flex-col gap-4 p-4 bg-white rounded-[2rem] shadow-sm border border-slate-100 hover:shadow-md transition-shadow duration-300">
            <div class="flex items-center gap-3 px-1">
                <div class="w-10 h-10 bg-slate-800 rounded-full shadow-sm"></div>
                <div>
                  <p class="text-sm font-bold text-slate-900">@anuel_AA</p>
                  <p class="text-[11px] text-slate-400 font-medium uppercase tracking-wider">Hace 2 min</p>
                </div>
            </div>
            <div class="relative aspect-[3/4] w-full bg-slate-100 rounded-[2rem] overflow-hidden border border-slate-200/50 group">
                <img src="/anuel5.jpeg" class="w-full h-full object-cover transform group-hover:scale-105 transition-all duration-700" alt="Post">
            </div>
            <div class="px-2 pb-2"><p class="text-sm text-slate-600"><span class="font-bold text-slate-900">@anuel_AA</span> brrr tamo activo</p></div>
        </article>

        <article class="flex flex-col gap-4 p-4 bg-white rounded-[2rem] shadow-sm border border-slate-100 hover:shadow-md transition-shadow duration-300">
            <div class="flex items-center gap-3 px-1">
                <div class="w-10 h-10 bg-indigo-600 rounded-full shadow-sm"></div>
                <div>
                  <p class="text-sm font-bold text-slate-900">@cruz</p>
                  <p class="text-[11px] text-slate-400 font-medium uppercase tracking-wider">Hace 15 min</p>
                </div>
            </div>
            <div class="relative aspect-[3/4] w-full bg-slate-100 rounded-[2rem] overflow-hidden border border-slate-200/50">
                <img src="/alvaro.png" class="w-full h-full object-cover" alt="Post">
            </div>
            <div class="px-2 pb-2"><p class="text-sm text-slate-600"><span class="font-bold text-slate-900">@cruz</span> Cita romántica</p></div>
        </article>

        <article class="flex flex-col gap-4 p-4 bg-white rounded-[2rem] shadow-sm border border-slate-100 hover:shadow-md transition-shadow duration-300">
            <div class="flex items-center gap-3 px-1">
                <div class="w-10 h-10 bg-rose-500 rounded-full shadow-sm"></div>
                <div>
                  <p class="text-sm font-bold text-slate-900">@nehuen_1</p>
                  <p class="text-[11px] text-slate-400 font-medium uppercase tracking-wider">Hace 1 h</p>
                </div>
            </div>
            <div class="relative aspect-[3/4] w-full bg-slate-100 rounded-[2rem] overflow-hidden border border-slate-200/50">
                <img src="nehuen.png" class="w-full h-full object-cover" alt="Post">
            </div>
            <div class="px-2 pb-2"><p class="text-sm text-slate-600"><span class="font-bold text-slate-900">@nehuen_1</span> Me aburro</p></div>
        </article>
    </div>

  </main>
</div>
